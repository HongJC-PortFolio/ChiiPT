<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
  http-equiv="Content-Security-Policy"
  content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self'; media-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
    <title>ChiiPT 개발 기반</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main>
      <button id="character" aria-label="캐릭터. 우클릭으로 제어 메뉴 열기">
        <img id="character-frame" alt="" draggable="false">
      </button>
    </main>
    <aside id="info">
      <p id="status" role="status"></p>

      <p class="hint">
        손 쓰다듬기 인식 준비<br>
        우클릭: 제어 메뉴 · 2초 누르기: 수면 · 더블클릭: 기상
      </p>
    </aside>
    <script type="module" src="index.js"></script>
  </body>
</html>
